  hard_drawdown: 0.15

execution:
  max_volume_participation: 0.05
  base_slippage_ticks: 1
  impact_ticks_at_full_participation: 4
  reject_open_on_limit_lock: true

evolution:
  auto_promote: false
  min_walk_forward_folds: 3
